<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeZero</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="tz-card">
    <!-- Header -->
    <header class="tz-header">
      <div class="tz-brand">
        <div class="tz-logo-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9" stroke="url(#tzLogoGrad)"></circle>
            <polygon points="10,8 16,12 10,16" fill="#ffffff"></polygon>
            <defs>
              <linearGradient id="tzLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FF1A35"/>
                <stop offset="100%" stop-color="#E60023"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <h1 class="tz-title">TubeZero</h1>
          <p class="tz-subtitle">YouTube Focus & Zero Clutter</p>
        </div>
      </div>
      <div class="tz-status-pill" id="statusPill">
        <span class="tz-status-dot"></span>
        <span id="statusText">Activo</span>
      </div>
    </header>

    <!-- Stats Dual Grid -->
    <div class="tz-stats-dual">
      <div class="tz-stat-card">
        <div class="tz-stat-info">
          <span class="tz-stat-label">Shorts Aniquilados</span>
          <span class="tz-stat-sub">Dopamina evitada</span>
        </div>
        <div class="tz-stat-number accent-red" id="statShorts">0</div>
      </div>

      <div class="tz-stat-card">
        <div class="tz-stat-info">
          <span class="tz-stat-label">Tiempo Salvado</span>
          <span class="tz-stat-sub">~3 min por Short</span>
        </div>
        <div class="tz-stat-number accent-green" id="statTimeSaved">0m</div>
      </div>
    </div>

    <!-- Presets -->
    <div class="tz-presets-bar">
      <button type="button" class="tz-preset-btn active" data-preset="study">Modo Estudio</button>
      <button type="button" class="tz-preset-btn" data-preset="monk">Modo Monje</button>
      <button type="button" class="tz-preset-btn" data-preset="custom">Libre</button>
    </div>

    <!-- Toggles List -->
    <div class="tz-toggles-list">
      <!-- Toggle: Home Feed -->
      <label class="tz-toggle-row">
        <div class="tz-toggle-info">
          <div class="tz-toggle-icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          </div>
          <div class="tz-toggle-text">
            <span class="tz-toggle-title">Eliminar Feed de Inicio</span>
            <span class="tz-toggle-desc">Sustituye por Buscador Zen</span>
          </div>
        </div>
        <input type="checkbox" id="checkHome" class="tz-switch" checked>
        <span class="tz-slider"></span>
      </label>

      <!-- Toggle: Shorts -->
      <label class="tz-toggle-row">
        <div class="tz-toggle-info">
          <div class="tz-toggle-icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          </div>
          <div class="tz-toggle-text">
            <span class="tz-toggle-title">Aniquilar Shorts</span>
            <span class="tz-toggle-desc">Oculta y redirige a normal</span>
          </div>
        </div>
        <input type="checkbox" id="checkShorts" class="tz-switch" checked>
        <span class="tz-slider"></span>
      </label>

      <!-- Toggle: Sidebar -->
      <label class="tz-toggle-row">
        <div class="tz-toggle-info">
          <div class="tz-toggle-icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
          </div>
          <div class="tz-toggle-text">
            <span class="tz-toggle-title">Ocultar Barra Lateral</span>
            <span class="tz-toggle-desc">Sin videos relacionados</span>
          </div>
        </div>
        <input type="checkbox" id="checkSidebar" class="tz-switch" checked>
        <span class="tz-slider"></span>
      </label>

      <!-- Toggle: Comments -->
      <label class="tz-toggle-row">
        <div class="tz-toggle-info">
          <div class="tz-toggle-icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div class="tz-toggle-text">
            <span class="tz-toggle-title">Ocultar Comentarios</span>
            <span class="tz-toggle-desc">Cero distracciones en video</span>
          </div>
        </div>
        <input type="checkbox" id="checkComments" class="tz-switch">
        <span class="tz-slider"></span>
      </label>

      <!-- Toggle: Endscreens -->
      <label class="tz-toggle-row">
        <div class="tz-toggle-info">
          <div class="tz-toggle-icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="5" rx="2"/><polygon points="10,9 15,12 10,15" fill="currentColor"/></svg>
          </div>
          <div class="tz-toggle-text">
            <span class="tz-toggle-title">Ocultar Pantallas Finales</span>
            <span class="tz-toggle-desc">Sin tarjetas en los últimos 20s</span>
          </div>
        </div>
        <input type="checkbox" id="checkEndscreen" class="tz-switch" checked>
        <span class="tz-slider"></span>
      </label>

      <!-- Toggle: Notifications -->
      <label class="tz-toggle-row">
        <div class="tz-toggle-info">
          <div class="tz-toggle-icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          </div>
          <div class="tz-toggle-text">
            <span class="tz-toggle-title">Ocultar Campana & Tendencias</span>
            <span class="tz-toggle-desc">Sin badges rojos estimulantes</span>
          </div>
        </div>
        <input type="checkbox" id="checkNotifications" class="tz-switch">
        <span class="tz-slider"></span>
      </label>
    </div>

    <!-- Footer & Shortcut -->
    <footer class="tz-footer">
      <div class="tz-shortcut-hint">
        <kbd>Alt</kbd> + <kbd>Z</kbd> Alternar Modo Enfoque en video
      </div>
      <button type="button" class="tz-reset-btn" id="btnReset" title="Restablecer valores originales">
        Restablecer
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
