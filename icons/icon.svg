<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tubezero-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A35"/>
      <stop offset="100%" stop-color="#D6001C"/>
    </linearGradient>
    <linearGradient id="tubezero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F121C"/>
      <stop offset="100%" stop-color="#07080D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tubezero-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  
  <!-- Outer Focus Ring with 4 Tactical Notches -->
  <g filter="url(#glow)">
    <circle cx="64" cy="64" r="42" fill="none" stroke="url(#tubezero-crimson)" stroke-width="8" stroke-dasharray="54 12" stroke-linecap="round"/>
  </g>
  
  <!-- Center Play / Focus Triangle -->
  <polygon points="54,46 54,82 84,64" fill="#FFFFFF"/>
</svg>